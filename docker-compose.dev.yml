version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: simple-backend-app-dev
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-simple_backend}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      NODE_ENV: development
    volumes:
      # Монтируем исходный код для hot-reload (read-write для изменений)
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./mock:/app/mock
      - ./package.json:/app/package.json
      - ./yarn.lock:/app/yarn.lock
      # Исключаем node_modules (используем из контейнера)
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

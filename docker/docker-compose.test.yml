services:
  db:
    image: postgres:16-alpine
    container_name: test-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - test-network

  test:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.test
    container_name: test-runner
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - NODE_ENV=test
      - PORT=3000
    networks:
      - test-network
    command: yarn test:docker

networks:
  test-network:
    driver: bridge
